<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Campo Minado</title>
  <style>
    :root {
      --header: #4a752c;
      --felt: #578a34;
      --tile-even: #aad751;
      --tile-odd: #a2d149;
      --tile-even-hover: #b8e05c;
      --tile-odd-hover: #b0d957;
      --open-even: #e5c29f;
      --open-odd: #d7b899;
      --panel: #4a752c;
      --text: #ffffff;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      --cell: 36px;
      --radius: 2px;
      --n1: #1976d2;
      --n2: #388e3c;
      --n3: #d32f2f;
      --n4: #7b1fa2;
      --n5: #f57c00;
      --n6: #0097a7;
      --n7: #424242;
      --n8: #9e9e9e;

      --img-tile-unrevealed-even: none;
      --img-tile-unrevealed-odd: none;
      --img-tile-revealed-empty: none;
      --img-flag: none;
      --img-mine: none;
      --img-mine-exploded: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--felt);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    .topbar {
      background: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background:
        linear-gradient(135deg, #aad751 50%, #a2d149 50%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat, select, .reset {
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.18);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font: inherit;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    select {
      cursor: pointer;
      outline: none;
    }

    select option { color: #222; }

    .reset {
      cursor: pointer;
      background: #8ecc39;
      color: #2c4a16;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .reset:hover { filter: brightness(1.08); }
    .reset:active { transform: scale(0.96); }

    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 16px 12px 28px;
    }

    .board-wrap {
      background: #4a752c;
      border-radius: 12px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--cols), var(--cell));
      grid-template-rows: repeat(var(--rows), var(--cell));
      width: calc(var(--cols) * var(--cell));
      touch-action: manipulation;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      position: relative;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: calc(var(--cell) * 0.48);
      line-height: 1;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .cell.closed.even { background: var(--tile-even); }
    .cell.closed.odd { background: var(--tile-odd); }
    .cell.closed.even:hover { background: var(--tile-even-hover); }
    .cell.closed.odd:hover { background: var(--tile-odd-hover); }

    .cell.closed.even.has-custom-closed {
      background-color: var(--tile-even);
      background-image: var(--img-tile-unrevealed-even);
      background-size: cover;
      background-position: center;
    }
    .cell.closed.odd.has-custom-closed {
      background-color: var(--tile-odd);
      background-image: var(--img-tile-unrevealed-odd);
      background-size: cover;
      background-position: center;
    }

    .cell.open.even { background: var(--open-even); }
    .cell.open.odd { background: var(--open-odd); }
    .cell.open.has-custom-open {
      background-image: var(--img-tile-revealed-empty);
      background-size: cover;
      background-position: center;
    }

    .cell.open {
      cursor: default;
      animation: pop 0.18s ease;
    }

    .cell.exploded { background: #e0614d !important; }

    .cell.n1 { color: var(--n1); }
    .cell.n2 { color: var(--n2); }
    .cell.n3 { color: var(--n3); }
    .cell.n4 { color: var(--n4); }
    .cell.n5 { color: var(--n5); }
    .cell.n6 { color: var(--n6); }
    .cell.n7 { color: var(--n7); }
    .cell.n8 { color: var(--n8); }

    .glyph {
      width: 68%;
      height: 68%;
      display: block;
      pointer-events: none;
      object-fit: contain;
    }

    .flag-svg, .mine-svg {
      width: 70%;
      height: 70%;
      display: block;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 50, 16, 0.45);
      display: none;
      place-items: center;
      z-index: 10;
      padding: 20px;
    }

    .overlay.show { display: grid; }

    .modal {
      background: #fff;
      color: #2c4a16;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      min-width: min(320px, 92vw);
      box-shadow: var(--shadow);
      animation: pop 0.22s ease;
    }

    .modal h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .modal p { margin-bottom: 18px; color: #4a5c3a; }

    .modal button {
      border: 0;
      background: #8ecc39;
      color: #2c4a16;
      font: inherit;
      font-weight: 800;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
    }

    @keyframes pop {
      from { transform: scale(0.86); opacity: 0.4; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 640px) {
      .brand span { display: none; }
      .topbar { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Campo Minado</span>
    </div>
    <div class="controls">
      <label>
        <select id="difficulty" aria-label="Dificuldade">
          <option value="easy">Fácil</option>
          <option value="medium">Médio</option>
          <option value="hard">Difícil</option>
        </select>
      </label>
      <div class="stat" title="Bandeiras restantes">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#e53935" d="M6 3v18h2v-7h9l-2-4 2-4H8V3z"/>
        </svg>
        <span id="flags">10</span>
      </div>
      <div class="stat" title="Tempo">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#fff" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 10.6 3.4 2-0.8 1.4L11 13V7h2z"/>
        </svg>
        <span id="timer">0</span>
      </div>
      <button class="reset" id="reset" type="button">Novo jogo</button>
    </div>
  </header>

  <main class="stage">
    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Tabuleiro"></div>
    </div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modal-title">Você ganhou!</h2>
      <p id="modal-text"></p>
      <button type="button" id="play-again">Jogar de novo</button>
    </div>
  </div>

  <script>
    const DIFFICULTIES = {
      easy:   { rows: 8,  cols: 10, mines: 10 },
      medium: { rows: 14, cols: 18, mines: 40 },
      hard:   { rows: 20, cols: 24, mines: 99 }
    };

    /**
     * Substitua as strings vazias por URLs de imagens personalizadas.
     * Placeholders do enunciado: URL_IMAGEM_BLOCO_PAR, URL_IMAGEM_BLOCO_IMPAR,
     * URL_IMAGEM_BLOCO_VAZIO, URL_IMAGEM_BANDEIRA, URL_IMAGEM_MINA,
     * URL_IMAGEM_MINA_EXPLODIDA.
     */
    const ASSETS = {
      tile_unrevealed_even: "",
      tile_unrevealed_odd: "",
      tile_revealed_empty: "",
      flag: "",
      mine: "",
      mine_exploded: ""
    };

    const PLACEHOLDERS = new Set([
      "URL_IMAGEM_BLOCO_PAR",
      "URL_IMAGEM_BLOCO_IMPAR",
      "URL_IMAGEM_BLOCO_VAZIO",
      "URL_IMAGEM_BANDEIRA",
      "URL_IMAGEM_MINA",
      "URL_IMAGEM_MINA_EXPLODIDA"
    ]);

    function assetUrl(value) {
      const url = (value || "").trim();
      if (!url || PLACEHOLDERS.has(url)) return "";
      return url;
    }

    function applyAssetVars() {
      const root = document.documentElement.style;
      const even = assetUrl(ASSETS.tile_unrevealed_even);
      const odd = assetUrl(ASSETS.tile_unrevealed_odd);
      const empty = assetUrl(ASSETS.tile_revealed_empty);
      root.setProperty("--img-tile-unrevealed-even", even ? `url("${even}")` : "none");
      root.setProperty("--img-tile-unrevealed-odd", odd ? `url("${odd}")` : "none");
      root.setProperty("--img-tile-revealed-empty", empty ? `url("${empty}")` : "none");
      document.body.dataset.customClosed = even || odd ? "1" : "";
      document.body.dataset.customOpen = empty ? "1" : "";
    }

    const FLAG_SVG = `
      <svg class="flag-svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#d32f2f" d="M7 3v18h2.2V13.6H19L16.6 9 19 4.4H9.2V3z"/>
        <rect x="6" y="20" width="6" height="1.6" rx="0.6" fill="#5d4037"/>
      </svg>`;

    const MINE_SVG = `
      <svg class="mine-svg" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="6.2" fill="#212121"/>
        <g stroke="#212121" stroke-width="1.8" stroke-linecap="round">
          <line x1="12" y1="3" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="21"/>
          <line x1="3" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/>
          <line x1="5.6" y1="5.6" x2="8.4" y2="8.4"/><line x1="15.6" y1="15.6" x2="18.4" y2="18.4"/>
          <line x1="18.4" y1="5.6" x2="15.6" y2="8.4"/><line x1="8.4" y1="15.6" x2="5.6" y2="18.4"/>
        </g>
        <circle cx="10.2" cy="10" r="1.4" fill="#eceff1"/>
      </svg>`;

    const boardEl = document.getElementById("board");
    const flagsEl = document.getElementById("flags");
    const timerEl = document.getElementById("timer");
    const difficultyEl = document.getElementById("difficulty");
    const overlayEl = document.getElementById("overlay");
    const modalTitleEl = document.getElementById("modal-title");
    const modalTextEl = document.getElementById("modal-text");

    let config = DIFFICULTIES.easy;
    let grid = [];
    let started = false;
    let minesPlaced = false;
    let over = false;
    let flagsLeft = 0;
    let revealedCount = 0;
    let seconds = 0;
    let timerId = null;
    let longPressTimer = null;
    let longPressFired = false;

    function inBounds(r, c) {
      return r >= 0 && c >= 0 && r < config.rows && c < config.cols;
    }

    function neighbors(r, c) {
      const list = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc)) list.push([nr, nc]);
        }
      }
      return list;
    }

    function createEmptyGrid() {
      grid = Array.from({ length: config.rows }, (_, r) =>
        Array.from({ length: config.cols }, (_, c) => ({
          r, c,
          mine: false,
          flagged: false,
          open: false,
          adjacent: 0
        }))
      );
    }

    function placeMines(safeR, safeC) {
      const forbidden = new Set();
      forbidden.add(safeR * config.cols + safeC);
      for (const [nr, nc] of neighbors(safeR, safeC)) {
        forbidden.add(nr * config.cols + nc);
      }

      const total = config.rows * config.cols;
      let available = total - forbidden.size;
      if (available < config.mines) {
        forbidden.clear();
        forbidden.add(safeR * config.cols + safeC);
        available = total - 1;
      }

      let placed = 0;
      while (placed < config.mines) {
        const idx = Math.floor(Math.random() * total);
        if (forbidden.has(idx)) continue;
        const r = Math.floor(idx / config.cols);
        const c = idx % config.cols;
        if (grid[r][c].mine) continue;
        grid[r][c].mine = true;
        placed++;
      }

      for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
          if (grid[r][c].mine) continue;
          grid[r][c].adjacent = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
        }
      }
    }

    function cellClass(cell) {
      const parity = (cell.r + cell.c) % 2 === 0 ? "even" : "odd";
      const state = cell.open ? "open" : "closed";
      const extra = [];
      if (!cell.open && document.body.dataset.customClosed) extra.push("has-custom-closed");
      if (cell.open && !cell.mine && document.body.dataset.customOpen) extra.push("has-custom-open");
      if (cell.open && cell.adjacent && !cell.mine) extra.push("n" + cell.adjacent);
      if (cell.open && cell.mine && cell.exploded) extra.push("exploded");
      return `cell ${state} ${parity} ${extra.join(" ")}`.trim();
    }

    function cellContent(cell) {
      if (!cell.open && cell.flagged) {
        const url = assetUrl(ASSETS.flag);
        return url ? `<img class="glyph" alt="" src="${url}">` : FLAG_SVG;
      }
      if (!cell.open) return "";
      if (cell.mine) {
        const url = assetUrl(cell.exploded ? ASSETS.mine_exploded : ASSETS.mine) || assetUrl(ASSETS.mine);
        return url ? `<img class="glyph" alt="" src="${url}">` : MINE_SVG;
      }
      return cell.adjacent ? String(cell.adjacent) : "";
    }

    function paintCell(cell) {
      const el = boardEl.children[cell.r * config.cols + cell.c];
      if (!el) return;
      el.className = cellClass(cell);
      el.innerHTML = cellContent(cell);
      el.setAttribute("aria-label", `Linha ${cell.r + 1}, coluna ${cell.c + 1}`);
    }

    function paintAll() {
      for (const row of grid) for (const cell of row) paintCell(cell);
    }

    function startTimer() {
      if (timerId) return;
      timerId = setInterval(() => {
        seconds += 1;
        timerEl.textContent = String(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function updateFlags() {
      flagsEl.textContent = String(flagsLeft);
    }

    function fitBoard() {
      const padding = 48;
      const header = document.querySelector(".topbar").offsetHeight;
      const maxW = Math.max(160, window.innerWidth - padding);
      const maxH = Math.max(160, window.innerHeight - header - 56);
      const size = Math.floor(Math.min(maxW / config.cols, maxH / config.rows, 42));
      boardEl.style.setProperty("--cell", Math.max(18, size) + "px");
      boardEl.style.setProperty("--cols", config.cols);
      boardEl.style.setProperty("--rows", config.rows);
    }

    function reveal(r, c) {
      const start = grid[r][c];
      if (over || start.open || start.flagged) return;

      if (!minesPlaced) {
        minesPlaced = true;
        placeMines(r, c);
      }
      if (!started) {
        started = true;
        startTimer();
      }

      const cell = grid[r][c];
      if (cell.mine) {
        cell.open = true;
        cell.exploded = true;
        lose();
        return;
      }

      const queue = [[r, c]];
      const seen = new Set([r + "," + c]);

      while (queue.length) {
        const [cr, cc] = queue.shift();
        const current = grid[cr][cc];
        if (current.open || current.flagged) continue;
        current.open = true;
        revealedCount += 1;
        paintCell(current);
        if (current.adjacent === 0) {
          for (const [nr, nc] of neighbors(cr, cc)) {
            const key = nr + "," + nc;
            if (!seen.has(key) && !grid[nr][nc].open && !grid[nr][nc].mine) {
              seen.add(key);
              queue.push([nr, nc]);
            }
          }
        }
      }

      checkWin();
    }

    function toggleFlag(r, c) {
      const cell = grid[r][c];
      if (over || cell.open) return;
      if (!started) {
        started = true;
        startTimer();
      }
      if (cell.flagged) {
        cell.flagged = false;
        flagsLeft += 1;
      } else {
        if (flagsLeft <= 0) return;
        cell.flagged = true;
        flagsLeft -= 1;
      }
      updateFlags();
      paintCell(cell);
    }

    function revealMines() {
      for (const row of grid) {
        for (const cell of row) {
          if (cell.mine) {
            cell.open = true;
            paintCell(cell);
          }
        }
      }
    }

    function lose() {
      over = true;
      stopTimer();
      revealMines();
      showModal("Você perdeu", "Uma mina explodiu. Tente outra vez.");
    }

    function checkWin() {
      const safe = config.rows * config.cols - config.mines;
      if (revealedCount < safe) return;
      over = true;
      stopTimer();
      for (const row of grid) {
        for (const cell of row) {
          if (cell.mine && !cell.flagged) {
            cell.flagged = true;
            flagsLeft = Math.max(0, flagsLeft - 1);
            paintCell(cell);
          }
        }
      }
      updateFlags();
      showModal("Você ganhou!", `Tabuleiro limpo em ${seconds}s.`);
    }

    function showModal(title, text) {
      modalTitleEl.textContent = title;
      modalTextEl.textContent = text;
      overlayEl.classList.add("show");
    }

    function hideModal() {
      overlayEl.classList.remove("show");
    }

    function bindCell(el, r, c) {
      el.addEventListener("click", (event) => {
        event.preventDefault();
        if (longPressFired) return;
        reveal(r, c);
      });

      el.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        toggleFlag(r, c);
      });

      el.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "touch") return;
        longPressFired = false;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          toggleFlag(r, c);
          if (navigator.vibrate) navigator.vibrate(18);
        }, 450);
      });

      el.addEventListener("pointerup", clearLongPress);
      el.addEventListener("pointercancel", clearLongPress);
      el.addEventListener("pointerleave", clearLongPress);
    }

    function clearLongPress() {
      clearTimeout(longPressTimer);
    }

    function newGame() {
      hideModal();
      stopTimer();
      started = false;
      minesPlaced = false;
      over = false;
      seconds = 0;
      revealedCount = 0;
      timerEl.textContent = "0";
      config = DIFFICULTIES[difficultyEl.value];
      flagsLeft = config.mines;
      updateFlags();
      applyAssetVars();
      createEmptyGrid();
      fitBoard();
      boardEl.innerHTML = "";
      for (let r = 0; r < config.rows; r++) {
        for (let c = 0; c < config.cols; c++) {
          const el = document.createElement("div");
          el.className = cellClass(grid[r][c]);
          el.setAttribute("role", "gridcell");
          bindCell(el, r, c);
          boardEl.appendChild(el);
        }
      }
    }

    document.getElementById("reset").addEventListener("click", newGame);
    document.getElementById("play-again").addEventListener("click", newGame);
    difficultyEl.addEventListener("change", newGame);
    window.addEventListener("resize", fitBoard);
    overlayEl.addEventListener("click", (event) => {
      if (event.target === overlayEl) hideModal();
    });

    applyAssetVars();
    newGame();
  </script>
</body>
</html>
